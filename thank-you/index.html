<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Thank You | Can I Afford</title>
    <meta name="description" content="Thanks for reaching out to Can I Afford.">

    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .check {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }
        h1 { color: #1f2937; font-size: 1.6rem; margin-bottom: 10px; font-weight: 700; }
        p { color: #6b7280; margin-bottom: 28px; font-size: 0.98rem; }
        .response-note {
            background: #f9fafb;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 14px 18px;
            text-align: left;
            font-size: 0.9rem;
            color: #374151;
            margin-bottom: 28px;
        }
        .calcs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .calc-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: #f9fafb;
            border: 1px solid #f3f4f6;
            border-radius: 12px;
            padding: 16px 10px;
            text-decoration: none;
            color: #1f2937;
            font-weight: 600;
            font-size: 0.88rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .calc-link:hover { transform: translateY(-2px); border-color: #667eea; }
        .calc-icon { font-size: 1.6rem; }
        .home-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
        .home-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✅</div>
        <h1>Got it — thank you!</h1>
        <p>Your message is on its way. Here's what happens next.</p>

        <div class="response-note">
            📬 I personally read every message. You can expect a reply within <strong>24–48 hours</strong>, usually sooner.
        </div>

        <div class="calcs-grid">
            <a href="/house/" class="calc-link"><span class="calc-icon">🏠</span> House</a>
            <a href="/car/" class="calc-link"><span class="calc-icon">🚗</span> Car</a>
            <a href="/wedding/" class="calc-link"><span class="calc-icon">💍</span> Wedding</a>
            <a href="/moveout/" class="calc-link"><span class="calc-icon">📦</span> Move Out</a>
        </div>

        <a href="/" class="home-link">Back to Home</a>
    </div>
</body>
</html>
